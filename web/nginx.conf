server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # nginx drops request headers containing "_" by default; the API's key header is `api_key`.
  underscores_in_headers on;

  # same-origin API: the browser never needs CORS
  location /api/ {
    proxy_pass http://api:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header api_key $http_api_key;  # underscore header is exposed to nginx as $http_api_key
  }
  location / { try_files $uri /index.html; }
}
